<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Active Learning Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
    <!-- Animated background blobs -->
    <div class="bg-gradient">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- App Shell -->
    <div class="app-shell">

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="brand-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 8V4H8"/>
                            <rect x="2" y="2" width="20" height="20" rx="5"/>
                            <path d="M8 10a2 2 0 1 0 0 4"/>
                            <path d="M16 10a2 2 0 1 1 0 4"/>
                            <path d="M9 18h6"/>
                        </svg>
                    </div>
                    <div class="brand-text">
                        <span class="brand-name">AL Chatbot</span>
                        <span class="brand-version">v3.0</span>
                    </div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <button class="nav-item active" onclick="switchTab('chat', this)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                    <span>Chat</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <div class="status-badge" id="statusBadge">
                    <span class="status-dot" id="statusDot"></span>
                    <span class="status-text" id="apiStatus">Connecting...</span>
                </div>
                <div class="model-badge" id="modelBadge">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/>
                        <line x1="16" y1="8" x2="2" y2="22"/>
                        <line x1="17.5" y1="15" x2="9" y2="15"/>
                    </svg>
                    <span id="modelVersion">Loading...</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Chat Tab -->
            <div id="chatTab" class="tab-content active">
                <div class="chat-panel">

                    <!-- Chat Header -->
                    <div class="chat-header">
                        <div class="chat-header-info">
                            <div class="chat-avatar-sm">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 8V4H8"/>
                                    <rect x="2" y="2" width="20" height="20" rx="5"/>
                                    <path d="M8 10a2 2 0 1 0 0 4"/>
                                    <path d="M16 10a2 2 0 1 1 0 4"/>
                                    <path d="M9 18h6"/>
                                </svg>
                            </div>
                            <div>
                                <h2 class="chat-title">Active Learning Chatbot</h2>
                                <p class="chat-subtitle">Powered by Qwen2.5 &middot; Continuously learning</p>
                            </div>
                        </div>
                    </div>

                    <!-- Messages Area -->
                    <div class="messages" id="messages">
                        <!-- Welcome screen -->
                        <div class="welcome-screen" id="welcomeScreen">
                            <div class="welcome-icon">
                                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 8V4H8"/>
                                    <rect x="2" y="2" width="20" height="20" rx="5"/>
                                    <path d="M8 10a2 2 0 1 0 0 4"/>
                                    <path d="M16 10a2 2 0 1 1 0 4"/>
                                    <path d="M9 18h6"/>
                                </svg>
                            </div>
                            <h3 class="welcome-title">How can I help you today?</h3>
                            <p class="welcome-subtitle">I'm an AI that learns and improves with every conversation. Ask me anything!</p>
                        </div>
                    </div>

                    <!-- Typing Indicator -->
                    <div class="typing-indicator" id="typingIndicator">
                        <div class="typing-avatar">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 8V4H8"/>
                                <rect x="2" y="2" width="20" height="20" rx="5"/>
                                <path d="M8 10a2 2 0 1 0 0 4"/>
                                <path d="M16 10a2 2 0 1 1 0 4"/>
                                <path d="M9 18h6"/>
                            </svg>
                        </div>
                        <div class="typing-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>

                    <!-- Input Area -->
                    <div class="input-area">
                        <div class="input-wrapper">
                            <input
                                type="text"
                                id="questionInput"
                                placeholder="Type your message..."
                                onkeypress="handleKeyPress(event)"
                                autocomplete="off"
                            >
                            <button onclick="askQuestion()" class="send-btn" id="sendBtn" title="Send message">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="22" y1="2" x2="11" y2="13"/>
                                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                                </svg>
                            </button>
                        </div>
                        <p class="input-hint">Press Enter to send &middot; AI responses may not always be accurate</p>
                    </div>

                </div>
            </div>

        </main>

    </div>

    <script src="app.js?v=4"></script>
</body>
</html>
